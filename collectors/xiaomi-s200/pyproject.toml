[project]
name = "ori-xiaomi-s200"
version = "0.1.0"
description = "Local Xiaomi S200 BLE collector for Ori"
requires-python = ">=3.11"
dependencies = ["bleak>=1.1,<4", "cryptography>=46,<51"]

[project.scripts]
ori-xiaomi-s200 = "collector:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["collector"]
