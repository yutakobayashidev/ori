<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>Offline · Personal Workspace</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #171717;
        color: #fafafa;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.75rem;
      }
      p {
        color: #b4b4b4;
        line-height: 1.6;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.75rem 1.25rem;
        background: #fafafa;
        color: #171717;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #fafafa;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Personal Workspace</p>
      <h1>You’re offline</h1>
      <p>Connect to the internet and try again to open your workspace.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
